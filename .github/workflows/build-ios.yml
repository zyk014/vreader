name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode info
        run: |
          xcodebuild -version
          xcodebuild -list -project vreader.xcodeproj

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -project vreader.xcodeproj             -scheme vreader             -resolvePackageDependencies             -destination 'generic/platform=iOS' || true

      - name: Build app (no codesign)
        run: |
          xcodebuild -project vreader.xcodeproj             -scheme vreader             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             build 2>&1 | tail -80

      - name: Apply ad-hoc signature
        run: |
          APP=
          echo "Signing: $APP"
          # Sign all frameworks first
          find "$APP/Frameworks" -name "*.framework" -type d | while read fw; do
            echo "Signing framework: $fw"
            codesign --force --sign - --entitlements /dev/null "$fw"
          done
          # Sign all dylibs
          find "$APP" -name "*.dylib" | while read dy; do
            echo "Signing dylib: $dy"
            codesign --force --sign - --entitlements /dev/null "$dy"
          done
          # Sign the app itself
          codesign --force --sign - --entitlements /dev/null "$APP"
          # Verify
          codesign -vv "$APP" || true

      - name: Package IPA
        run: |
          mkdir -p /tmp/ipa_out
          APP=
          if [ -z "$APP" ]; then
            echo "ERROR: app not found"
            find build -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r ipa_out/VReader.ipa Payload/
          ls -lh /tmp/ipa_out/VReader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VReader-IPA
          path: /tmp/ipa_out/VReader.ipa

      - name: Upload build logs (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: build/
          if-no-files-found: warn
