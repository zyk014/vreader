name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode*.app/Contents/Developer

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -project vreader.xcodeproj \
            -scheme vreader \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' || true

      - name: Build app (no codesign)
        run: |
          xcodebuild -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.vreader.app \
            build 2>&1 | tail -50

      - name: Package IPA
        run: |
          mkdir -p /tmp/ipa_out
          APP=$(find build -name "vreader.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: vreader.app not found"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r ipa_out/VReader.ipa Payload/
          ls -lh /tmp/ipa_out/VReader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VReader-IPA
          path: /tmp/ipa_out/VReader.ipa

      - name: Upload build logs (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: build/
          if-no-files-found: warn
