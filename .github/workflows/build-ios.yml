name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode info
        run: |
          xcodebuild -version
          xcodebuild -list -project vreader.xcodeproj

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -project vreader.xcodeproj \
            -scheme vreader \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' || true

      - name: Build app (no codesign)
        run: |
          xcodebuild -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -80

      - name: Apply ad-hoc signature
        run: |
          set +e
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Found app: ${APP_PATH}"
          if [ -z "${APP_PATH}" ]; then
            echo "ERROR: No .app found"
            find build -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Signing frameworks..."
          find "${APP_PATH}/Frameworks" -name "*.framework" -type d 2>/dev/null | while read fw; do
            echo "  -> ${fw}"
            codesign --force --sign - "${fw}" 2>&1
          done
          echo "Signing dylibs..."
          find "${APP_PATH}" -name "*.dylib" 2>/dev/null | while read dy; do
            echo "  -> ${dy}"
            codesign --force --sign - "${dy}" 2>&1
          done
          echo "Signing app..."
          codesign --force --sign - "${APP_PATH}" 2>&1
          echo "Verifying..."
          codesign -vv "${APP_PATH}" 2>&1 || true

      - name: Package IPA
        run: |
          set +e
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "${APP_PATH}" ]; then
            echo "ERROR: app not found"
            exit 1
          fi
          echo "Found: ${APP_PATH}"
          mkdir -p /tmp/Payload
          cp -R "${APP_PATH}" /tmp/Payload/
          cd /tmp && zip -r ipa_out/VReader.ipa Payload/
          mkdir -p /tmp/ipa_out
          cd /tmp && zip -r ipa_out/VReader.ipa Payload/
          ls -lh /tmp/ipa_out/VReader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VReader-IPA
          path: /tmp/ipa_out/VReader.ipa

      - name: Upload build logs (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-logs
          path: build/
          if-no-files-found: warn
